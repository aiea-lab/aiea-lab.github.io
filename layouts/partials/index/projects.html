{{ $projects := where .Site.RegularPages "Type" "project" }}
{{ if $projects }}
<section id="projects" class="home-section"><div class="container">
  <div class="row"><div class="col-xs-12 section-heading text-center">
    <h1>{{ .Site.Params.projects.title | default "Projects" }}</h1>
    {{ with .Site.Params.projects.subtitle }}<p>{{ . | markdownify }}</p>{{ end }}
  </div></div>
  {{ partial "project_cards.html" $projects.ByDate.Reverse }}
</div></section>
{{ end }}
