<style>
.people-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px 20px;margin:28px 0 45px}
.people-card{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0;align-self:start}
.people-card img{display:block;width:110px;height:110px;object-fit:cover;border-radius:50%;margin:0 auto 14px}
.people-card h3{font-size:18px;line-height:1.5;height:auto;min-height:0;width:100%;margin:0 0 2px;overflow-wrap:anywhere}
.people-card h3 a{display:block;line-height:inherit}
.people-card p{font-size:14px;margin:4px 0;color:#555}
.people-card .person-now-at{max-width:240px;margin:8px auto 0;line-height:1.6;overflow-wrap:anywhere}
.people-card .person-now-at span{display:block;font-size:12px;color:#777;margin-bottom:2px}
.team-section{margin-top:40px}
@media(max-width:991px){.people-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:600px){.people-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:400px){.people-grid{grid-template-columns:1fr}}
</style>
